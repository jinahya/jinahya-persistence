# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "develop", "main", "sketch" ]
  pull_request:
    branches: [ "develop", "main", "sketch" ]

jobs:
  build:

    runs-on: ubuntu-latest

    # one run per persistence provider, each building every Jakarta EE generation (jinahya-persistence-NN); the
    # generation is a module, not a profile, so only the provider varies, as ./_mvn.sh does locally
    strategy:
      # one broken provider should not hide the state of the other
      fail-fast: false
      matrix:
        provider: [ hibernate-orm, eclipselink ]

    name: build (${{ matrix.provider }})

    steps:
    - uses: actions/checkout@v4
    # The build JDK, not the target: each generation compiles its main classes for its own minimum Java SE
    # (--release 17 for jinahya-persistence-11), and the test classes for 25 (maven.compiler.testRelease), which
    # only a JDK 25 javac can do. Keep this in step with .java-version and with the enforcer's requireJavaVersion
    # bound in the root pom.
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B verify -P${{ matrix.provider }}

  # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
  # Submitted once, from the default provider, so the two builds do not overwrite each other's snapshot
  dependency-graph:

    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@v4
