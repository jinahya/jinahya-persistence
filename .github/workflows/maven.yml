# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "develop", "main", "sketch" ]
  pull_request:
    branches: [ "develop", "main", "sketch" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    # The build JDK, not the target. Main sources are compiled with --release 21 (see
    # maven.compiler.release) so the artifacts stay usable on 21; the TEST sources are
    # compiled with --release 25 (maven.compiler.testRelease), which a JDK 21 javac cannot
    # do -- it fails with "release version 25 not supported". Keep this in step with
    # .java-version and with the enforcer's requireJavaVersion bound in the root pom.
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven


#    - name: Build with Maven
#      run: mvn -B package --file pom.xml


    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    - name: Build
      run: mvn -B verify

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    - name: Update dependency graph
#      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
      uses: advanced-security/maven-dependency-submission-action@v4

  # Both persistence providers. Jakarta EE 11 is the only supported platform generation and every
  # implementation is pinned to its single aligned release, so the only thing worth varying is which
  # provider implements Jakarta Persistence. The job above runs exactly one of the two -- whatever is
  # activeByDefault -- so EclipseLink was never exercised anywhere but on a developer's machine, via
  # _mvn_jakarta_ee_11.sh. This is that script, as a matrix.
  #
  # Naming any profile on the command line deactivates every activeByDefault profile. That is
  # harmless now that the provider is the only axis: the cell names the provider it wants, and
  # nothing else was riding on the defaults.
  #
  # `test` rather than `verify`: the convergence enforcer is bound to `validate`, so it runs in every
  # cell already, and there is nothing at `verify` -- no integration tests exist -- that varies by
  # provider.
  providers:

    runs-on: ubuntu-latest

    strategy:
      # one broken provider should not hide the state of the other
      fail-fast: false
      matrix:
        provider:
          - jakarta-ee-11-hibernate-orm
          - jakarta-ee-11-eclipselink

    name: ${{ matrix.provider }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Test
      run: >
        mvn -B test
        -P${{ matrix.provider }}
